apiVersion: v1
kind: Pod
metadata:
  name: storage-demo
spec:
  containers:
    - name: demo
      image: busybox:1.36
      command:
        - sh
        - -c
        - "while true; do sleep 3600; done"
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: demo-data